<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Justify Content Application</title>
    <style>
        /* ul#list {
            border: 1px solid black;
            padding: 1rem;
            display: flex;
            justify-content: space-evenly;
            list-style-type: none;
            width: 50%;
            margin: auto;
        } */
    </style>

    <style>
        button {
            padding: .5rem;
        }

        .card {
            border: 1px solid #ccc;
            width: 200px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            background-color:rgb(67, 227, 255);
        }


        #list{
            display:flex;
            list-style-type:none;
            border:1px solid black;
            padding:1rem;
            width:75%;
            margin:auto;
            justify-content: space-between;
        }

        #buttons{
            display: flex;
            justify-content: space-around;
            background-color:rgb(10, 110, 192);
            width: 75%;
            margin: auto;
            padding:1rem;
        }

      #cards{
        display: flex;
        justify-content: space-around;
        background-color: rgb(5, 78, 62);
        width: 75%;
        margin:auto;
        padding: 1rem;
      }
        

        #links{
         display:flex;
            list-style-type:none;
            border:1px solid black;
            padding:1rem;
            width:75%;
            margin:auto;
            justify-content: space-between;
        }

    </style>
</head>

<body>
    <h1>Flexbox Justify Content Application</h1>

    <h2>Lists</h2>
    <ul id="list">
        <li>Inline</li>
        <li>Block</li>
        <li>Flexbox</li>
        <li>Grid</li>
    </ul>

    <h2>Buttons</h2>

   <div id="buttons">
        <button type="button">Button 1</button>
        <button type="button">Button 2</button>
        <button type="button">Button 3</button>
        <button type="button">Button 4</button>
        <button type="button">Button 5</button>
    
   </div>


    <h2>Cards</h2>
 <div id="cards">
        <div class="card">
            <h3>Card Title 1</h3>
            <p>This is a description for card 1.</p>
        </div>
        <div class="card">
            <h3>Card Title 2</h3>
            <p>This is a description for card 1.</p>
        </div>
        <div class="card">
            <h3>Card Title 3</h3>
            <p>This is a description for card 1.</p>
        </div>
 </div>

    <h2>Link </h2>
        
       <div id="links">
                <li><a href="https://google.com/">Google</a></li>
                <li><a href="https://google.com/">Google</a></li>
                <li><a href="https://google.com/">Google</a></li>
                <li><a href="https://google.com/">Google</a></li>
       </div>
        
  

</body>

</html>
